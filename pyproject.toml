[project]
name = "lung-cancer-detection-cnn"
version = "0.1.0"
description = "Lung Cancer Prediction using CNN and Transfer Learning"
readme = "Lung-cancer-model-train/README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "tensorflow-intel>=2.15.0,<2.17.0; sys_platform == 'win32'",
    "tensorflow>=2.15.0,<2.17.0; sys_platform != 'win32'",
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "pillow>=10.0.0",
    "h5py>=3.10.0",
    "ipykernel>=6.29.0",
    "opencv-python>=4.8.0",
]

[tool.uv]
package = false
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
override-dependencies = [
    "tensorflow-io-gcs-filesystem<=0.31.0; sys_platform == 'win32'"
]
